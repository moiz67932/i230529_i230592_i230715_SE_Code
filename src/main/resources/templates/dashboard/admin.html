<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/main :: head(${title})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content-shell">
        <section class="surface-panel">
            <div th:replace="~{fragments/topbar :: topbar(${pageTitle}, ${pageSubtitle})}"></div>
            <div class="row g-3 mb-4">
                <div class="col-lg-3">
                    <div class="metric-card">
                        <div class="metric-label">Total leads</div>
                        <div class="display-metric" th:text="${metrics.totalLeads()}"></div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="metric-card">
                        <div class="metric-label">Unassigned</div>
                        <div class="display-metric" th:text="${metrics.unassignedLeads()}"></div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="metric-card">
                        <div class="metric-label">Overdue</div>
                        <div class="display-metric" th:text="${metrics.overdueFollowUps()}"></div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="metric-card">
                        <div class="metric-label">Recent activities</div>
                        <div class="display-metric" th:text="${metrics.recentActivities()}"></div>
                    </div>
                </div>
            </div>
            <div class="detail-grid">
                <section class="detail-card span-6">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Stage distribution</h2>
                            <p class="section-caption">Current active pipeline mix by stage.</p>
                        </div>
                    </div>
                    <div class="meta-list">
                        <div class="meta-row" th:each="entry : ${metrics.stageDistribution()}">
                            <span class="meta-label" th:text="${entry.key}"></span>
                            <span class="meta-value" th:text="${entry.value}"></span>
                        </div>
                    </div>
                </section>
                <section class="detail-card span-6">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Lead source mix</h2>
                            <p class="section-caption">Where new opportunities are entering the pipeline.</p>
                        </div>
                    </div>
                    <div class="meta-list" th:if="${!metrics.sourceBreakdown().isEmpty()}">
                        <div class="meta-row" th:each="entry : ${metrics.sourceBreakdown()}">
                            <span class="meta-label" th:text="${entry.key}"></span>
                            <span class="meta-value" th:text="${entry.value}"></span>
                        </div>
                    </div>
                    <div class="empty-state" th:if="${metrics.sourceBreakdown().isEmpty()}">No lead sources recorded yet.</div>
                </section>
            </div>
        </section>
    </main>
</div>
</body>
</html>
