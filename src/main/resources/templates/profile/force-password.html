<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/main :: head('Change Password')}"></head>
<body>
<div class="login-shell">
    <div class="card-soft p-5" style="max-width: 560px; width: 100%;">
        <p class="eyebrow mb-2">Security required</p>
        <h1 class="page-title mb-3">Update your temporary password</h1>
        <p class="page-subtitle mb-4">You need to choose a new password before continuing into PipelineX.</p>
        <div th:replace="~{fragments/flash :: flash}"></div>
        <form th:action="@{/profile/password/force}" th:object="${passwordForm}" method="post" class="d-grid gap-3">
            <div>
                <label class="form-label" for="newPassword">New password</label>
                <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}">
                <div class="text-danger small mt-1" th:errors="*{newPassword}"></div>
            </div>
            <div>
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}">
                <div class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Save new password</button>
        </form>
    </div>
</div>
</body>
</html>
