<div th:fragment="flash">
    <div class="flash-stack">
        <div class="alert alert-success border-0 shadow-sm" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger border-0 shadow-sm" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-warning border-0 shadow-sm" role="alert" th:if="${warningMessage}" th:text="${warningMessage}"></div>
    </div>
</div>
