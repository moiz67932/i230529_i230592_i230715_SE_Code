spring:
  application:
    name: PipelineX
  thymeleaf:
    cache: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pipelinex}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        default_batch_fetch_size: 32
  flyway:
    enabled: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  web:
    resources:
      cache:
        period: 0

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.security: INFO

app:
  seed:
    enabled: true
  security:
    password-min-length: 8
